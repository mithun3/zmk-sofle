# CI build matrix. One block per keyboard: left (central, with ZMK Studio), right, settings reset.
---
include:
  # Eyelash Sofle
  - board: eyelash_sofle_left
    shield: nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_left
  - board: eyelash_sofle_right
    shield: nice_view_gem
    artifact-name: eyelash_sofle_right
  - board: eyelash_sofle_left
    shield: settings_reset
    artifact-name: eyelash_sofle_settings_reset

  # Corne
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: corne_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: corne_settings_reset
